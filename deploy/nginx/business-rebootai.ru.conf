# Reverse proxy for docker-compose.production.yml (the app listens on 127.0.0.1:3200 only).
#
# Trust boundary: this proxy is the only hop the app trusts (TRUSTED_PROXY_HOPS=1 in the compose
# file). It OVERWRITES X-Forwarded-For with the address of the TCP peer, so nothing a client
# sends in X-Forwarded-For, X-Real-IP or Forwarded reaches the app.
#
# Behind a CDN, do not raise TRUSTED_PROXY_HOPS. Restore the real client address in nginx
# instead, accepting the header only from the CDN's published ranges:
#   set_real_ip_from <CDN range>;   # one line per range
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;
# $remote_addr then holds the client address and the headers below stay as they are.
#
# Install: copy to /etc/nginx/sites-available/, link into sites-enabled, `nginx -t`, reload.

server {
    listen 80;
    listen [::]:80;
    server_name business-rebootai.ru www.business-rebootai.ru;
    return 301 https://business-rebootai.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.business-rebootai.ru;
    ssl_certificate /etc/letsencrypt/live/business-rebootai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/business-rebootai.ru/privkey.pem;
    return 301 https://business-rebootai.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name business-rebootai.ru;

    ssl_certificate /etc/letsencrypt/live/business-rebootai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/business-rebootai.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The API rejects JSON bodies over 64 KB; keep a little headroom.
    client_max_body_size 128k;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";

        proxy_read_timeout 30s;
    }
}
